    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        var isViteWsError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'object'
            ? ((msg.message || '') + ' ' + (msg.stack || '') + ' ' + (msg.reason || '') + ' ' + String(msg))
            : String(msg);
          return str.indexOf('ws.send') !== -1 ||
                 str.indexOf('/@vite/client') !== -1 ||
                 str.indexOf('[vite] failed to connect to websocket') !== -1 ||
                 str.indexOf('evaluating \'ws.send\'') !== -1;
        };

        var origConsoleError = console.error;
        if (typeof origConsoleError === 'function') {
          console.error = function() {
            var first = arguments[0];
            var second = arguments[1];
            if (
              (typeof first === 'string' && first.indexOf('[vite]') !== -1 && (isViteWsError(first) || isViteWsError(second))) ||
              isViteWsError(first)
            ) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.filename) || isViteWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Capture Android / Chrome beforeinstallprompt immediately (even while user is on the Registration screen)
        window.__deferredPwaPrompt = window.__deferredPwaPrompt || null;
        window.__pwaIsInstalled = false;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          try {
            window.dispatchEvent(new CustomEvent('pwa-install-available'));
          } catch (err) {}
        });
        window.addEventListener('appinstalled', function() {
          window.__pwaIsInstalled = true;
          window.__deferredPwaPrompt = null;
          try {
            window.dispatchEvent(new CustomEvent('pwa-app-installed'));
          } catch (err) {}
        });

        // Register service worker immediately for Android PWA installability & device notifications
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
            console.warn('Notification SW registration:', err);
          });
        }
      })();
    </script>
