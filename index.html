<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        var isViteWsError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'object' ? (msg.message || msg.reason || String(msg)) : String(msg);
          return str.indexOf('ws.send') !== -1 ||
                 str.indexOf('[vite]') !== -1 ||
                 str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('evaluating \'ws.send\'') !== -1;
        };

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || (event.error && isViteWsError(event.error.message))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Register service worker for Android device notifications
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
              console.warn('Notification SW registration:', err);
            });
          });
        }
      })();
    </script>
    <title>9jacash - Your Goals. Our Priority.</title>
    <meta name="description" content="Premium Nigerian digital banking and payments platform with instant transfers, airtime top-ups, and cashback rewards." />
    <meta property="og:title" content="9jacash - Digital Banking & Payments" />
    <meta property="og:description" content="Fast, secure, and reliable banking tailored for you." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-title" content="9jacash" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
